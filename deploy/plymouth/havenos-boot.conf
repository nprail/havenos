# Drop-in for plymouth-quit.service, installed by deploy/install.sh.
# 1. Keep the boot splash up until the havenOS window has drawn its first frame (havenos.service is Type=notify and
#    says READY then).
# 2. Quit with --retain-splash. A plain `plymouth quit` resets the display after the app has taken it, and every
#    page flip then fails (EINVAL, a blank screen; checked on a Pi 4).
[Unit]
After=havenos.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash

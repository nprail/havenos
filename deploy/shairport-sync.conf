// Mirrors what havenOS writes when it manages shairport-sync itself (core/media/sources/airplay.py `_write_config`).
general = {
  name = "havenOS";                       // the name phones show; set it to match [music.airplay] name
  output_backend = "pipe";
  ignore_volume_control = "yes";          // havenOS owns the one master volume
};
sessioncontrol = {
  allow_session_interruption = "yes";     // a new sender may take over (spec 07: takeovers are never blocked)
  active_state_timeout = 300.0;           // a paused sender keeps its place for 5 minutes
};
pipe = { name = "/var/lib/havenos/airplay/audio.pipe"; };
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/var/lib/havenos/airplay/metadata.pipe";
  pipe_timeout = 5000;
};
